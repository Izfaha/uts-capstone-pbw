services:
  mariadb:
    image: mariadb:latest
    container_name: mariadb-container
    restart: always
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=1
      - MYSQL_DATABASE=webdailyjournal
    ports:
      - "3303:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-container
    restart: always
    environment:
      - PMA_HOST=mariadb
      - UPLOAD_LIMIT=64M
      - PMA_ALLOW_NO_PASSWORD=1
    ports:
      - "8000:80"
    depends_on:
      - mariadb
  server-nginx:
    image: nginx:alpine
    container_name: nginx-container
    ports:
      - "8085:80"
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: always
  
  app:
    build:
      context: .
    volumes:
      - .:/var/www/html
    restart: always

volumes:
  mariadb_data:
